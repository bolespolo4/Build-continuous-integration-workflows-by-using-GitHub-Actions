name: Label when approved

on: pull_request_review

jobs:
    label-when-approved:
        runs-on: ubuntu-latest
        steps:
            - name: Label when approved
            uses: pullreminders/label-when-approved-action@v4
            env:
                APPROVALS: "1"
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                ADD_LABEL: "approved"